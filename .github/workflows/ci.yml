name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: make install

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # The oracle must score 1.0 on every executable level, the broken model 0.0
      # strict, and the safety guard must actually fire. If the oracle drops, the
      # benchmark is broken - not the model.
      - name: Guards
        run: make guards

      # T2: the oracle repair (T1 canonical solution) must pass every induced
      # fault; a no-op repair must pass none. If either fails, t2_repair.jsonl
      # or the repair verifier is broken - not a model.
      - name: Guards (T2 repair)
        run: make guards-t2

      # T3 lenient: apptainer is not installed here, so this only checks what
      # syntax/resource_fit/safety can prove without it. The strict bracket
      # (docker-guards-t3) runs in the container job below, where apptainer
      # is actually active.
      - name: Guards (T3 recipes, lenient)
        run: make guards-t3

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The container is the only faithful environment: SLURM, bash 5, GNU coreutils.
      # Here `submittability` is active, so the oracle is checked against a real scheduler.
      - name: Build the verification image
        run: make docker-build

      - name: Run the suite inside the container
        run: make docker-test

      - name: Oracle against a real scheduler
        run: make docker-run

      - name: Oracle repair against a real scheduler
        run: make docker-repair

      # T3: apptainer's unprivileged build/run needs seccomp=unconfined and
      # /dev/fuse, not --privileged (see docs/DESIGN.md, Apptainer recipes).
      # Confirmed on Docker Desktop for Windows; ruled out on Docker Desktop
      # for Mac (nested linuxkit VM). GitHub-hosted runners are bare Linux
      # VMs, not nested, so this is expected to work the same way, but this
      # is the first time it runs here: if it fails, that is a new finding
      # about this specific environment, not a regression to paper over.
      # Ubuntu 24.04 pairs AppArmor with apparmor_restrict_unprivileged_userns: an
      # unconfined process may still create a user namespace, but the kernel moves it to
      # a stripped profile with no capabilities inside it, so the fakeroot build dies on
      # `mount namespace requires privileges`. docker-default is no way out either: it
      # keeps capabilities in the namespace but denies the mount syscall itself, which
      # was the previous failure. The runner is an ephemeral VM, so the knob is dropped
      # host-wide for this job only.
      - name: Allow unprivileged user namespaces on this runner
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Reports the facts the choice of mode depends on: whether the setuid starter is
      # there, whether a user namespace can be created at all, and which capabilities the
      # container was given. Runs before the guard so a failure below is explained by the
      # lines above it rather than by a later run.
      # Never allowed to fail the job. A broken probe once blocked the guard it exists to
      # explain, which is the worst thing a diagnostic can do: it cost a whole run and
      # taught nothing about the failure under investigation.
      - name: What apptainer can do on this runner
        run: make docker-apptainer-probe
        continue-on-error: true

      # Attempting the unprivileged route: as root without CAP_SYS_ADMIN, apptainer mounts
      # directly and dies on `Failed to set mount propagation`, during %post and again at
      # run time. A user namespace supplies that capability inside itself, which asks
      # nothing of Docker. The alternative is --cap-add SYS_ADMIN, the broadest capability
      # the kernel has, and this is the attempt to avoid needing it.
      - name: Guards (T3 recipes, strict, apptainer active)
        run: make docker-guards-t3 APPTAINER_UNPRIVILEGED=1

      # The guard prints which levels dropped and, with -v, the per-task reason. These
      # files carry the rest: every level of every sample. Without them a failure here
      # can only be reproduced by someone who has a machine that reproduces it.
      - name: Keep the T3 result files when the guard fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: t3-recipe-results
          path: results/anvil_recipe_*.json
          if-no-files-found: warn
