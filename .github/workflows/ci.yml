name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: make install

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # The oracle must score 1.0 on every executable level, the broken model 0.0
      # strict, and the safety guard must actually fire. If the oracle drops, the
      # benchmark is broken - not the model.
      - name: Guards
        run: make guards

      # T2: the oracle repair (T1 canonical solution) must pass every induced
      # fault; a no-op repair must pass none. If either fails, t2_repair.jsonl
      # or the repair verifier is broken - not a model.
      - name: Guards (T2 repair)
        run: make guards-t2

      # T3 lenient: apptainer is not installed here, so this only checks what
      # syntax/resource_fit/safety can prove without it. The strict bracket
      # (docker-guards-t3) runs in the container job below, where apptainer
      # is actually active.
      - name: Guards (T3 recipes, lenient)
        run: make guards-t3

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The container is the only faithful environment: SLURM, bash 5, GNU coreutils.
      # Here `submittability` is active, so the oracle is checked against a real scheduler.
      - name: Build the verification image
        run: make docker-build

      - name: Run the suite inside the container
        run: make docker-test

      - name: Oracle against a real scheduler
        run: make docker-run

      - name: Oracle repair against a real scheduler
        run: make docker-repair

      # T3: apptainer's unprivileged build/run needs seccomp=unconfined and
      # /dev/fuse, not --privileged (see docs/DESIGN.md, Apptainer recipes).
      # Confirmed on Docker Desktop for Windows; ruled out on Docker Desktop
      # for Mac (nested linuxkit VM). GitHub-hosted runners are bare Linux
      # VMs, not nested, so this is expected to work the same way, but this
      # is the first time it runs here: if it fails, that is a new finding
      # about this specific environment, not a regression to paper over.
      - name: Guards (T3 recipes, strict, apptainer active)
        run: make docker-guards-t3
