[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-bench"
version = "0.1.0"
description = "Executable benchmarking of LLM-generated and LLM-repaired HPC operational artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []                     # the core has no dependencies: runs anywhere

[project.optional-dependencies]
models = ["transformers>=4.40", "torch>=2.2", "accelerate>=0.30"]
quant = ["bitsandbytes>=0.43"]        # requires an NVIDIA GPU
ssm = ["mamba-ssm", "causal-conv1d"]  # for Mamba-Codestral (can be finicky to build)
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
anvil = "anvil.cli:main"

[tool.setuptools.packages.find]
include = ["anvil*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
