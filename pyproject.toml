[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-bench"
version = "0.1.0"
description = "Executable benchmarking of LLM-generated and LLM-repaired HPC operational artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Antonio Rotundo" }]
keywords = ["hpc", "slurm", "benchmark", "llm", "evaluation", "apptainer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]
dependencies = []                     # the core has no dependencies: runs anywhere

[project.urls]
Homepage = "https://github.com/antoniorotundo2/anvil"
Source = "https://github.com/antoniorotundo2/anvil"
Issues = "https://github.com/antoniorotundo2/anvil/issues"

[project.optional-dependencies]
models = ["transformers>=4.40", "torch>=2.2", "accelerate>=0.30"]
quant = ["bitsandbytes>=0.43"]        # requires an NVIDIA GPU
ssm = ["mamba-ssm", "causal-conv1d"]  # for Mamba-Codestral (can be finicky to build)
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
anvil = "anvil.cli:main"

# The task files live at the repository root, where every script, Makefile target and
# document refers to them, and every published number was measured against that layout.
# An installed copy has no repository around it, so the same directory is mapped into the
# package as `anvil/data` at build time and `anvil/resources.py` falls back to it. Nothing
# moves, and a checkout keeps reading `tasks/` exactly as before.
[tool.setuptools]
packages = ["anvil", "anvil.data", "anvil.policies"]

[tool.setuptools.package-dir]
"anvil.data" = "tasks"
"anvil.policies" = "policies"

[tool.setuptools.package-data]
"anvil.data" = ["*.jsonl"]
"anvil.policies" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
